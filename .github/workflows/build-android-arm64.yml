name: Build Cloudflared Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'cmd/cloudflared/android_resolver.go'
      - '.github/workflows/build-android-arm64.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build Android ARM64 executable
        shell: bash
        env:
          ANDROID_NDK_VERSION: 27.2.12479018
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export GOOS=android
          export GOARCH=arm64
          export CGO_ENABLED=1
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o app/src/main/jniLibs/arm64-v8a/libcloudflared.so \
            ./cmd/cloudflared
          file app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libcloudflared.so | grep -E 'Class:|Machine:|Type:'

      - name: Upload Android ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: libcloudflared-android-arm64
          path: app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          if-no-files-found: error
          retention-days: 14
